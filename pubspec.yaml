name: oye
description: OYE — Personal Music Streaming
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio playback with queue, shuffle, repeat
  just_audio: ^0.9.40

  # Background audio playback + lock screen controls
  just_audio_background: ^0.0.1-beta.12

  # Image caching
  cached_network_image: ^3.4.1

  # HTTP for the YouTube Music search engine and Bugs lyrics
  http: ^1.2.0

  # App documents directory for optional offline downloads
  path_provider: ^2.1.4

  # Music videos, stages and fancams (AVPlayer / ExoPlayer, HLS supported)
  video_player: ^2.9.2

  # State management
  provider: ^6.1.2

  # Persistent key-value storage
  shared_preferences: ^2.3.3

  # Reactive streams
  rxdart: ^0.27.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Fake audio platform for widget tests
  just_audio_platform_interface: ^4.6.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  # App Store rejects icons with an alpha channel.
  remove_alpha_ios: true
  # Android adaptive icon: glass + record in the safe zone over the brand red.
  adaptive_icon_background: "#E8243F"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/A2Z-OFL.txt

  # 에이투지체 (SIL OFL 1.1), used by the "Drizon Music" wordmark.
  fonts:
    - family: A2Z
      fonts:
        - asset: assets/fonts/A2Z-1Thin.otf
          weight: 100
        - asset: assets/fonts/A2Z-2ExtraLight.otf
          weight: 200
        - asset: assets/fonts/A2Z-3Light.otf
          weight: 300
        - asset: assets/fonts/A2Z-4Regular.otf
          weight: 400
        - asset: assets/fonts/A2Z-5Medium.otf
          weight: 500
        - asset: assets/fonts/A2Z-6SemiBold.otf
          weight: 600
        - asset: assets/fonts/A2Z-7Bold.otf
          weight: 700
        - asset: assets/fonts/A2Z-8ExtraBold.otf
          weight: 800
        - asset: assets/fonts/A2Z-9Black.otf
          weight: 900
